<section class="report-layout">
  <article class="report-panel customer-panel">
    <header class="panel-header">
      <h2>Top Carts</h2>
    </header>

    <div class="table-head">
      <span>Cart</span>
      <span>Count</span>
      <span>Value</span>
    </div>

    <ul class="customer-list">
      @for (cart of topCarts; track cart.label) {
      <li class="customer-row">
        <div class="customer-cell name-cell">
          <div class="revenue-highlight" [style.width.%]="getBarWidth(cart.value)"></div>
          <span>{{ cart.label }}</span>
        </div>
        <span class="orders-cell">{{ cart.count }}</span>
        <span class="revenue-cell">{{ formatCurrency(cart.value) }}</span>
      </li>
      }
    </ul>
  </article>

  <article class="report-panel category-panel">
    <header class="panel-header panel-header-split">
      <h2>Top Categories</h2>
      <div class="meta-actions">
        <span class="active">Treemap</span>
        <span>Top 10</span>
      </div>
    </header>

    <div class="treemap-grid">
      @for (group of cartGroups; track group.name) {
      <div class="tree-tile" [class]="group.tileClass" [style.background]="group.color">
        <div>{{ group.name }}</div>
        <strong>{{ group.value | number:'1.0-2' }}</strong>
      </div>
      }
    </div>
  </article>
</section>
