<section class="w-full py-8">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold">New Arrivals</h2>


    <div class="flex gap-2">
      <button (click)="scroll(scrollRef, -1)"
        class="w-8 h-8 rounded-full border flex items-center justify-center hover:bg-green-50">
        ◀
      </button>
      <button (click)="scroll(scrollRef, 1)"
        class="w-8 h-8 rounded-full border flex items-center justify-center hover:bg-green-50">
        ▶
      </button>
    </div>
  </div>

  <!-- Products Slider -->
  <div #scrollRef class="no-scrollbar flex items-stretch gap-5 overflow-x-auto scroll-smooth pb-2">

    @for (medicine of newArrival | slice:0:8; track medicine.productId){
    <app-product-card type="new_arrival" [medicine]="medicine">
    </app-product-card>
    }
  </div>

  <!-- View All -->
  <div class="text-right mt-4">
    <a class="text-green-600 text-sm hover:underline cursor-pointer" routerLink="/offers">
      New Arrivals.. →
    </a>
  </div>

</section>
