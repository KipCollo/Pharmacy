<nav class="w-full border-b border-slate-200 bg-white">
  <div class="flex h-14 w-full items-center justify-between px-6">
    <div class="relative group hidden md:block">
      <button type="button" class="browse-btn" routerLink="/products">
        <span class="inline-flex h-4 w-4 items-center justify-center rounded-sm bg-white/15 text-[11px]">≡</span>
        <span>Browse All Categories</span>
        <lucide-icon [img]="icons.ChevronDown" class="h-4 w-4"></lucide-icon>
      </button>

      <div class="menu-panel hidden w-60 group-hover:block">
        @for (category of productCategory | slice:0:8; track category.id) {
        <a class="menu-item" routerLink="/products">{{ category.name }}</a>
        }
      </div>
    </div>

    <div class="nav-links mx-6 flex flex-1 items-center justify-center gap-6 text-sm text-slate-700">
      <a class="nav-link hot" routerLink="/offers">
        <lucide-icon [img]="icons.Flame" class="h-4 w-4 text-emerald-500"></lucide-icon>
        <span>Hot Deals</span>
      </a>
      <a class="nav-link" routerLink="/home">Home</a>
      <a class="nav-link" routerLink="/about">About</a>
      <a class="nav-link" routerLink="/trending">Blog</a>
      <a class="nav-link" routerLink="/products">Vendors</a>
      <a class="nav-link" routerLink="/contact">Contact</a>
    </div>

    <div class="hidden items-center gap-3 lg:flex">
      <button class="prescription-btn" routerLink="/prescription" type="button">Prescription</button>

      <div class="support flex items-center gap-2">
        <lucide-icon [img]="icons.Headset" class="h-5 w-5 text-slate-500"></lucide-icon>
        <div>
          <p class="m-0 text-lg font-semibold leading-none text-emerald-500">1900 - 888</p>
          <p class="m-0 mt-1 text-[11px] leading-none text-slate-400">24/7 Support Center</p>
        </div>
      </div>
    </div>
  </div>
</nav>
