<div class="w-full border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-24 w-full max-w-7xl items-center gap-4 px-6">
    <div class="logo-wrap shrink-0 cursor-pointer" (click)="home()">
      <div class="logo-mark text-blue-600">&#12638;</div>
      <div>
        <p class="m-0 text-lg font-bold leading-none">
          <span class="text-green-600">KipCollo</span>
        </p>
      </div>
    </div>

    <div class="search-shell hidden flex-1 items-center lg:flex">
      <button class="category-btn" type="button">All Category</button>
      <input type="text" placeholder="Search" class="search-input" />
      <button class="search-btn" type="button" aria-label="Search">
        <lucide-icon [img]="icons.Search" class="h-4 w-4"></lucide-icon>
      </button>
    </div>

    <div class="ml-auto flex items-center gap-4 text-sm text-slate-500">
      <button class="location-chip hidden items-center gap-1 xl:flex" type="button">
        <lucide-icon [img]="icons.MapPin" class="h-4 w-4 text-emerald-500"></lucide-icon>
        <span>Your Location</span>
      </button>

      <a class="top-action" routerLink="/trending">
        <lucide-icon [img]="icons.Info" class="h-4.5 w-4.5 text-emerald-500"></lucide-icon>
        <span>Compare</span>
      </a>

      <a class="top-action" routerLink="/wishlist">
        <lucide-icon [img]="icons.Heart" class="h-4.5 w-4.5 text-emerald-500"></lucide-icon>
        <span>Wishlist</span>
      </a>

      <a class="top-action relative" routerLink="/cart">
        <lucide-icon [img]="icons.ShoppingCart" class="h-4.5 w-4.5 text-emerald-500"></lucide-icon>
        <span>Cart</span>
        <span class="cart-dot">{{ cartStore.getCartCount() }}</span>
      </a>

      <a class="top-action" routerLink="/login">
        <lucide-icon [img]="icons.User" class="h-4.5 w-4.5 text-slate-500"></lucide-icon>
        <span>Account</span>
      </a>
    </div>
  </div>
</div>
